
# =============================================================================
# UTER AI ENGINEERING STANDARD (UAES)
# Global Standard Registry
# =============================================================================
#
# Registry: .uaes/STANDARD-REGISTRY.yaml
# System: UTER AI Engineering Standard
# Registry schema version: 1.0.0
# Registry content version: 1.7.0
# Scope: P00 - P12 (domains 00-12; all 13 domains registered, see history 1.7.0)
# Build depth: enterprise
# Delivery mode: all
# Existing engineering relationship: parallel
#
# IMPORTANT:
# 1. This is the global registry, not a phase-specific registry.
# 2. P0-P3 entries are maintained together.
# 3. Historical entries are preserved where recoverable.
# 4. Reconstructed entries are explicitly marked RECONSTRUCTED.
# 5. Registration does not imply approval or implementation.
# 6. Do not delete previous phase entries when adding new phases.
#
# =============================================================================

registry:
  id: "UAES-GLOBAL-REGISTRY"
  name: "UTER AI Engineering Standard"
  abbreviation: "UAES"
  version: "1.7.0"
  schema_version: "1.0.0"
  status: "DRAFT"

  project:
    name: "Uter"
    repository: "https://github.com/hu-xulin/uter"
    architecture_relationship: "PARALLEL"
    platform_scope:
      - "PC_WEB"
      - "H5"
      - "ANDROID"
      - "IOS"
      - "HARMONYOS"
      - "ELECTRON"

  governance:
    single_source_of_truth: ".uaes/STANDARD-REGISTRY.yaml"
    standard_directory: "standards/"
    schema_directory: ".uaes/schemas/"
    gate_directory: "quality/gates/"
    script_directory: "quality/scripts/"
    acceptance_directory: "quality/acceptance/"
    report_directory: "reports/"
    skill_registry: "skills/REGISTRY.yaml"
    decision_directory: "architecture/decisions/"

    rules:
      preserve_existing_entries: true
      unique_standard_ids: true
      unique_schema_paths: true
      validate_references: true
      validate_dependencies: true
      prohibit_implicit_approval: true
      prohibit_implicit_implementation: true

  lifecycle_status:
    - "DRAFT"
    - "PROPOSED"
    - "IN_REVIEW"
    - "APPROVED"
    - "IMPLEMENTED"
    - "VERIFIED"
    - "DEPRECATED"
    - "SUPERSEDED"

  requirement_levels:
    - "MUST"
    - "MUST_NOT"
    - "SHOULD"
    - "SHOULD_NOT"
    - "MAY"

  priority_levels:
    - "P0"
    - "P1"
    - "P2"
    - "P3"

  provenance:
    historical: "Recovered from previous UAES design and delivery records."
    reconstructed: "Reconstructed in this registry; requires document-level confirmation."
    new: "Newly registered after this registry revision."

