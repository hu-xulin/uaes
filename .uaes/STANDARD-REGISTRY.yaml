# =============================================================================
# GLOBAL VALIDATION POLICY
# =============================================================================

validation:

  registry:
    require_unique_ids: true
    require_unique_file_paths: true
    require_valid_yaml: true
    require_known_phases: true
    require_known_statuses: true
    require_known_provenance: true

  references:
    require_existing_standard_references: true
    require_existing_schema_references: true
    require_existing_gate_references: true
    require_existing_acceptance_references: true
    reject_dangling_dependencies: true
    reject_circular_dependencies: true

  files:
    require_registered_standard_files: true
    require_registered_schema_files: true
    require_registered_gate_files: true
    require_registered_acceptance_files: true

  governance:
    draft_is_not_approved: true
    approved_is_not_implemented: true
    implemented_is_not_verified: true
    require_evidence_for_verified_status: true
    require_human_approval_where_governance_demands: true

