version: "1.0.0"
source_repository: hu-xulin/uter
source_commit: "337485b4b19824f9bee59b6f8226802b455ab0ec"
migration_system:
  main_database: "GORM AutoMigrate plus ordered custom migration functions"
  log_database: "MigrateAuditLogs plus ClickHouse native DDL or GORM AutoMigrate"
  supported_main_databases: [sqlite, mysql, postgresql]
  supported_log_databases: [sqlite, mysql, postgresql, clickhouse]
  independent_migration_ledger: false
  rollback_harness: NOT_PROVIDED
  cross_database_migration_matrix: NOT_VERIFIED
auto_migrate:
  entrypoint: model/main.go#migrateDB
  models:
    - Channel
    - Token
    - User
    - UserSession
    - AuthFlow
    - ExternalIdentityClaim
    - PasskeyCredential
    - Option
    - LoginEncryptionKey
    - Redemption
    - Ability
    - Log
    - Midjourney
    - TopUp
    - QuotaData
    - Task
    - TaskPlugin
    - Model
    - Vendor
    - VendorMergeRule
    - PrefillGroup
    - Setup
    - Organization
    - RefundIntent
    - TwoFA
    - TwoFABackupCode
    - Checkin
    - SubscriptionOrder
    - UserSubscription
    - SubscriptionPreConsumeRecord
    - CustomOAuthProvider
    - UserOAuthBinding
    - PerfMetric
    - SystemInstance
    - SystemTask
    - SystemTaskLock
    - CasbinRule
    - AuthzRole
    - UserAccessToken
    - EmailQuotaUsage
custom_steps:
  - id: DBM-001
    scope: main
    source: model/main.go
    function: ensureUserQuotaColumns
    invoked_from: model/main.go#InitDB
    phase: preflight
    order: 1
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Operator must migrate legacy 32-bit wallet columns to 64-bit before startup; SKIP_64BIT_QUOTA_SCHEMA_CHECK is an explicit bypass."
  - id: DBM-002
    scope: main
    source: model/token_migration.go
    function: migrateTokenKeyUniqueness
    invoked_from: model/main.go#migrateDB
    phase: before_auto_migrate
    order: 10
    failure_mode: STOP_STARTUP
    rollback_status: TRANSACTIONAL_DDL_WHERE_SUPPORTED
    recovery: "Inspect existing PostgreSQL unique constraints and index definitions; preserve unknown constraints and investigate manually."
  - id: DBM-003
    scope: main
    source: model/prefill_group_migration.go
    function: migratePrefillGroupUniqueness
    invoked_from: model/main.go#migrateDB
    phase: before_auto_migrate
    order: 20
    failure_mode: STOP_STARTUP
    rollback_status: TRANSACTIONAL_DDL_WHERE_SUPPORTED
    recovery: "Inspect global uniqueness constraints and partial unique index definition before retry."
  - id: DBM-004
    scope: main
    source: model/main.go
    function: migrateSubscriptionPlanPriceAmount
    invoked_from: model/main.go#migrateDB
    phase: before_auto_migrate
    order: 30
    failure_mode: LOG_AND_CONTINUE
    rollback_status: NOT_PROVIDED
    recovery: "Verify subscription_plans.price_amount type and values per database dialect; retry controlled conversion."
  - id: DBM-005
    scope: main
    source: model/main.go
    function: migrateTokenModelLimitsToText
    invoked_from: model/main.go#migrateDB
    phase: before_auto_migrate
    order: 40
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Verify tokens.model_limits type and preserve existing contents before retry."
  - id: DBM-006
    scope: main
    source: model/option_primary_key_migration.go
    function: migrateOptionPrimaryKey
    invoked_from: model/main.go#migrateDB
    phase: before_auto_migrate
    order: 50
    failure_mode: LOG_AND_CONTINUE
    rollback_status: BACKUP_TABLE_CREATED
    recovery: "Inspect options_legacy_* backup table and rebuilt options primary key; do not drop backup without independent verification."
  - id: DBM-007
    scope: main
    source: model/usedata_migration.go
    function: dedupeQuotaDataAggregatesOnce
    invoked_from: model/main.go#migrateDB
    phase: before_auto_migrate
    order: 60
    failure_mode: LOG_AND_CONTINUE
    rollback_status: NOT_PROVIDED
    recovery: "Reconcile quota_data aggregate totals before retry; operation merges duplicate groups and removes duplicate rows."
  - id: DBM-008
    scope: main
    source: model/main.go
    function: AutoMigrate
    invoked_from: model/main.go#migrateDB
    phase: schema
    order: 70
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Use verified database backup and dialect-specific schema inspection; GORM AutoMigrate is not treated as reversible."
  - id: DBM-009
    scope: main
    source: model/main.go
    function: InitializeUserAuthVersions
    invoked_from: model/main.go#migrateDB
    phase: data
    order: 80
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Inspect affected user authentication version fields and rerun idempotent initializer after correction."
  - id: DBM-010
    scope: main
    source: model/user_email_migration.go
    function: migrateUserEmailNormalization
    invoked_from: model/main.go#migrateDB
    phase: data
    order: 90
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Resolve case-insensitive duplicate email groups before retry; function intentionally skips normalization when duplicates exist."
  - id: DBM-011
    scope: main
    source: model/main.go
    function: EnsureLegacyAccessTokenRetireAt
    invoked_from: model/main.go#migrateDB
    phase: data
    order: 100
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Inspect access-token retirement timestamps and rerun initializer."
  - id: DBM-012
    scope: main
    source: model/main.go
    function: InitializeExternalIdentityClaims
    invoked_from: model/main.go#migrateDB
    phase: data
    order: 110
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Inspect external identity claim records and uniqueness constraints before retry."
  - id: DBM-013
    scope: main
    source: model/main.go
    function: ensureSubscriptionPlanTableSQLite
    invoked_from: model/main.go#migrateDB
    phase: sqlite_specific
    order: 120
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Compare subscription_plans columns with the SQLite DDL and preserve existing values."
  - id: DBM-014
    scope: log
    source: model/audit_log.go
    function: MigrateAuditLogs
    invoked_from: model/main.go#InitLogDB
    phase: schema
    order: 10
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Inspect audit_logs schema or ClickHouse table DDL and retained audit records."
  - id: DBM-015
    scope: log
    source: model/main.go
    function: migrateClickHouseLogDB
    invoked_from: model/main.go#migrateLOGDB
    phase: clickhouse_schema
    order: 20
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "Inspect MergeTree DDL and TTL expression; preserve audit and usage log retention requirements."
  - id: DBM-016
    scope: log
    source: model/main.go
    function: AutoMigrate
    invoked_from: model/main.go#migrateLOGDB
    phase: schema
    order: 30
    failure_mode: STOP_STARTUP
    rollback_status: NOT_PROVIDED
    recovery: "GORM AutoMigrate for logs table; use verified backup and dialect-specific inspection."
  - id: DBM-017
    scope: log
    source: model/log_index_migration.go
    function: migrateLogIndexRedundancy
    invoked_from: model/main.go#migrateLOGDB
    phase: index
    order: 40
    failure_mode: LOG_AND_CONTINUE
    rollback_status: RECREATE_INDEX_FROM_MODEL
    recovery: "Recreate idx_logs_user_id or idx_logs_model_name only after confirming composite-index coverage and query plans."
  - id: DBM-018
    scope: log
    source: model/main.go
    function: runLogCacheTokenBackfillOnce
    invoked_from: model/main.go#InitLogDB
    phase: backfill
    order: 50
    failure_mode: LOG_AND_RETRY_ON_NEXT_START
    rollback_status: NOT_PROVIDED
    recovery: "Check options marker log_cache_tokens_backfilled and compare cache token columns against other JSON before rerun."
  - id: DBM-019
    scope: main
    source: model/frontend_option_migration.go
    function: MigrateRetiredFrontendOptions
    invoked_from: main.go#main
    phase: legacy_data
    order: 130
    failure_mode: LOG_AND_CONTINUE
    rollback_status: TRANSACTION_PER_OPTION
    recovery: "Inspect source and target option keys; malformed legacy values are retained and logged."
  - id: DBM-020
    scope: main
    source: model/twofa_migration.go
    function: MigrateTwoFASecretsToEncrypted
    invoked_from: operator_or_explicit_call
    phase: security_data
    order: MANUAL
    failure_mode: RETURNS_PER_RECORD_FAILURES
    rollback_status: NOT_PROVIDED
    recovery: "Failed plaintext secrets are retained for retry; verify encryption envelope and failed IDs before rerun."
manual_sql:
  - path: bin/migration_v0.2-v0.3.sql
    status: LEGACY_MANUAL
    rollback_status: NOT_PROVIDED
    recovery: "Historical quota transfer; reconcile users.quota and tokens.remain_quota from a verified backup."
  - path: bin/migration_v0.3-v0.4.sql
    status: LEGACY_MANUAL
    rollback_status: NOT_PROVIDED
    recovery: "Historical ability rows are inserted idempotently using NOT EXISTS; verify target ability tuples."
