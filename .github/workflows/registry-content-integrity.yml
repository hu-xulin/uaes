# Registry Content Integrity — Layer-1 content gate with three-way verification.
#
# Complements (does not replace) `uaes-validation.yml` from the agent-governance
# workstream. That workflow validates registries/manifests via Ruby + Python;
# this one validates the *content* of every registered artefact and proves the
# gate can actually block a violation (positive / negative / bypass).
#
# Scope boundary: the Uter product repo is NOT checked out here (architecture
# relationship PARALLEL, product repo is read-only). `--scope=content` therefore
# executes only G-019..G-023; the other 18 checks are reported NOT_RUN and are
# never executed. Building a fake product-repo stub to make G-006/G-007/G-014
# return PASS would be manufactured evidence and is explicitly rejected.
# For the full 23-check run, execute locally with a real Uter checkout:
#   node quality/scripts/uaes/validate-registry.mjs --no-write
#
# Added 2026-11-05 after an audit showed `validate-registry.mjs` returned
# 18/18 PASS while four registered Schemas and one standard document were
# zero bytes. See reports/compliance/UAES-P00-REGISTRY-CONTENT-GATE.md.
name: Registry Content Integrity

on:
  push:
    branches: [main, "ai/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-integrity:
    name: Schema / standard bytes and three-way gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Set up Python for the YAML fallback
        # paths.mjs resolves js-yaml/ajv from a hard-coded product-repo path.
        # On a Linux runner neither is available, so loadYaml() falls back to
        # `python3 -c "import yaml"`. Pin the version instead of relying on a
        # preinstalled, drifting PyYAML.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned PyYAML
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Run Layer-1 content gate (no report write)
        run: node quality/scripts/uaes/validate-registry.mjs --no-write --scope=content

      # FAIL=0 is NOT the same as VERIFIED. Assert that the five content checks
      # really executed and that nothing outside the content scope was reported
      # as PASS — i.e. no product-repo check was faked into a green result.
      - name: Assert evidence semantics (no hidden or fake PASS)
        run: |
          node --input-type=module -e '
          import { runValidation, CONTENT_CHECK_IDS } from "./quality/scripts/uaes/validate-registry.mjs";
          const r = runValidation({ scope: "content" });
          const content = r.checks.filter(c => CONTENT_CHECK_IDS.includes(c.id));
          const other = r.checks.filter(c => !CONTENT_CHECK_IDS.includes(c.id));
          const badContent = content.filter(c => c.status !== "PASS").map(c => `${c.id}=${c.status}`);
          const fakePass = other.filter(c => c.status === "PASS").map(c => c.id);
          const badOther = other.filter(c => c.status !== "NOT_RUN").map(c => `${c.id}=${c.status}`);
          if (content.length !== CONTENT_CHECK_IDS.length || badContent.length || r.summary.fail) {
            console.error("content gate not VERIFIED:", badContent.join(",") || "missing checks", `FAIL=${r.summary.fail}`);
            process.exit(1);
          }
          if (fakePass.length || badOther.length) {
            console.error("unexpected out-of-scope status:", [...fakePass.map(id=>`${id}=PASS`), ...badOther].join(","));
            process.exit(1);
          }
          console.log(`evidence: content PASS=${content.length}, out-of-scope NOT_RUN=${other.length}, FAIL=0`);
          '

      - name: Three-way gate tests (positive / negative / bypass)
        run: node quality/scripts/uaes/validate-registry.test.mjs

      - name: Verify gate steps produced no report side effects
        run: |
          test -z "$(git status --porcelain -- reports/)" || {
            echo "gate wrote into reports/:";
            git status --porcelain -- reports/;
            exit 1;
          }
