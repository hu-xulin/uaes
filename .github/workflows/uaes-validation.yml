name: UAES Governance Validation

on:
  push:
    branches: [main, "ai/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uaes-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Registry, manifests, and references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check Ruby runtime
        run: ruby --version
      - name: Validate UAES registries and manifests
        run: ruby quality/scripts/validate-governance.rb
      - name: Validate P00 Foundation registry invariants
        run: ruby quality/scripts/validate-p00-foundation.rb
      - name: Test P00 Foundation positive and negative fixtures
        run: ruby quality/scripts/test-p00-foundation.rb
      - name: Test skill runtime adapter positive and negative fixtures
        run: ruby quality/scripts/agents/test-skill-runtime-adapters.rb
      - name: Validate canonical skill runtime adapters
        run: ruby quality/scripts/agents/check-skill-runtime-adapters.rb
      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2 jsonschema==4.25.1
      - name: Validate active JSON Schema meta-schemas
        run: python quality/scripts/validate-json-schemas.py
