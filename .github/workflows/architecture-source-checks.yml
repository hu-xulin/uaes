name: Architecture Source Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "quality/scripts/architecture/**"
      - ".uaes/registry/modules.yaml"
      - ".github/workflows/architecture-source-checks.yml"

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: uaes
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: hu-xulin/uter
          ref: 442ddb5a7c234f2ee2d78651e0882407e9371c91
          path: uter
      - name: Validate module manifests
        working-directory: uaes
        env:
          UTER_REPO_ROOT: ${{ github.workspace }}/uter
        run: ruby quality/scripts/architecture/check-architecture-manifests
      - name: Validate RelayKit module boundary
        working-directory: uaes
        env:
          UTER_REPO_ROOT: ${{ github.workspace }}/uter
        run: ruby quality/scripts/architecture/check-module-boundaries
      - name: Run RelayKit boundary positive and negative controls
        working-directory: uaes
        run: ruby quality/scripts/architecture/test-module-boundaries.rb
      - name: Prepare generated embed path for package discovery
        run: mkdir -p uter/web/dist/docs-content/_next && touch uter/web/dist/index.html uter/web/dist/uaes-architecture-placeholder.html uter/web/dist/docs-content/_next/uaes-architecture-placeholder.html
      - name: Validate Go module dependency allowlist
        working-directory: uaes
        env:
          UTER_REPO_ROOT: ${{ github.workspace }}/uter
        run: ruby quality/scripts/architecture/check-dependency-rules
      - name: Run dependency allowlist positive and negative controls
        working-directory: uaes
        run: ruby quality/scripts/architecture/test-dependency-rules.rb
      - name: Validate OpenAPI contracts and compatibility
        working-directory: uaes
        env:
          UTER_REPO_ROOT: ${{ github.workspace }}/uter
        run: ruby quality/scripts/architecture/check-api-contracts
      - name: Run API contract positive and negative controls
        working-directory: uaes
        run: ruby quality/scripts/architecture/test-api-contracts.rb
      - name: Validate database migration inventory integrity (not rollback acceptance)
        working-directory: uaes
        env:
          UTER_REPO_ROOT: ${{ github.workspace }}/uter
        run: ruby quality/scripts/architecture/check-database-migrations
