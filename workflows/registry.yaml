version: "1.0.0"
status: "DRAFT"
registry:
  id: "UAES-WORKFLOW-REGISTRY"
  source_of_truth: "workflows/registry.yaml"
  default_permission_effect: "deny"
governance:
  require_owner: true
  require_trigger: true
  require_inputs_outputs: true
  require_stop_conditions: true
  require_evidence: true
workflows:
