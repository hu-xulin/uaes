  - id: "UAES-WF-BUGFIX"
    name: "Bug Fix"
    path: "workflows/bug-fix/WORKFLOW.md"
    status: "DRAFT"
    trigger: "Confirmed defect, regression, or production issue requiring a code fix."
    standards: ["UAES-00", "UAES-01", "UAES-04", "UAES-06", "UAES-08", "UAES-09", "UAES-10", "UAES-11"]
  - id: "UAES-WF-EMERGENCY"
    name: "Emergency Response"
    path: "workflows/emergency-response/WORKFLOW.md"
